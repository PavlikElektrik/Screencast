{% extends 'base.html' %}
{% block content %}
<div class="container mt-4">
    <div class="alert alert-danger">
        Вы точно хотите удалить "{{ object.name }}"?
    </div>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'home' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
